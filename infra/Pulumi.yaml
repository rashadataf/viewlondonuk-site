name: viewlondonuk
description: ViewLondon UK web infrastructure (Traefik reverse proxy + Next.js site) managed with Pulumi YAML and Docker. Minimal resources.
runtime: yaml

config:
  {
    "pulumi:autonaming": { value: { pattern: "${name}-${project}-${stack}" } },
    "CORE_STACK_NAME": { type: "string" },
    "HTTP_PORT": { type: "string", default: "80" },
    "HTTPS_PORT": { type: "string", default: "443" },
    "DOMAIN_NAME": { type: "string", default: "localhost" },
    "ADMIN_EMAIL": { type: "string", secret: true },

    "SITE_IMAGE_NAME": { type: "string", default: "viewlondonuk/site" },
    "APP_PORT": { type: "string", default: "3000" },
    "SITE_BUILD_CONTEXT": { type: "string", default: "../site" },
    "SITE_WORKDIR_PATH": { type: "string", default: "/site" },
    "SITE_IMAGE_TAG": { type: "string", default: "latest" },
    "SITE_BUILD_PHASE_TARGET": { type: "string", default: "development" },

    "ENABLE_TLS": { type: "boolean", default: false },
    "PROTOCOL": { type: "string", default: "http" },
    "ROUTER_ENTRYPOINT": { type: "string", default: "web" },
    "TRAEFIK_METRICS_PORT": { type: "string", default: "4318" },
  }

variables:
  {
    CORE_STACK_NAME: "${CORE_STACK_NAME}",
    HTTP_PORT: "${HTTP_PORT}",
    HTTPS_PORT: "${HTTPS_PORT}",
    DOMAIN_NAME: "${DOMAIN_NAME}",
    ADMIN_EMAIL: "${ADMIN_EMAIL}",

    SITE_IMAGE_NAME: "${SITE_IMAGE_NAME}",
    APP_PORT: "${APP_PORT}",
    SITE_BUILD_CONTEXT: "${SITE_BUILD_CONTEXT}",
    SITE_WORKDIR_PATH: "${SITE_WORKDIR_PATH}",
    SITE_IMAGE_TAG: "${SITE_IMAGE_TAG}",
    SITE_BUILD_PHASE_TARGET: "${SITE_BUILD_PHASE_TARGET}",

    ENABLE_TLS: "${ENABLE_TLS}",
    PROTOCOL: "${PROTOCOL}",
    ROUTER_ENTRYPOINT: "${ROUTER_ENTRYPOINT}",

    FRONTEND_CONTAINER_NAME: "${pulumi.project}-viewlondonuk-${pulumi.stack}",
    APP_NETWORK_NAME: "${pulumi.project}-network",
    MAIN_NETWORK_NAME: "${coreStack.outputs.appNetworkName}",
  }

resources:
  {
    coreStack:
      {
        type: "pulumi:pulumi:StackReference",
        properties: { name: "${CORE_STACK_NAME}" },
      },
    appNetwork:
      { type: "docker:Network", properties: { name: "${APP_NETWORK_NAME}" } },

    nextBuildVolume:
      { type: "docker:Volume", properties: { name: "site_next_build" } },

    siteImage:
      {
        type: "docker:RemoteImage",
        properties:
          {
            name: "${SITE_IMAGE_NAME}:${SITE_IMAGE_TAG}",
            build:
              {
                context: "${SITE_BUILD_CONTEXT}",
                buildArgs: { "SITE_WORKDIR_PATH": "${SITE_WORKDIR_PATH}" },
                target: "${SITE_BUILD_PHASE_TARGET}",
              },
          },
      },

    siteContainer:
      {
        type: "docker:Container",
        properties:
          {
            name: "${FRONTEND_CONTAINER_NAME}",
            image: "${siteImage.imageId}",
            restart: "always",
            envs:
              [
                "PORT=${APP_PORT}",
                "DOMAIN_NAME=${DOMAIN_NAME}",
                "PROTOCOL=${PROTOCOL}",
              ],
            mounts:
              [
                {
                  type: "bind",
                  source: "${pulumi.cwd}/../site",
                  target: "${SITE_WORKDIR_PATH}",
                },
                {
                  type: "volume",
                  source: "${nextBuildVolume.name}",
                  target: "${SITE_WORKDIR_PATH}/.next",
                },
              ],
            networksAdvanced:
              [
                { name: "${APP_NETWORK_NAME}" },
                { name: "${MAIN_NETWORK_NAME}" },
              ],
            labels:
              [
                { label: "traefik.enable", value: "true" },
                {
                  label: "traefik.http.services.site.loadbalancer.server.port",
                  value: "${APP_PORT}",
                },
                {
                  label: "traefik.http.routers.site.entrypoints",
                  value: "${ROUTER_ENTRYPOINT}",
                },
                {
                  label: "traefik.http.routers.site.rule",
                  value: "Host(`${DOMAIN_NAME}`)",
                },
                {
                  label: "traefik.http.routers.site.tls",
                  value: "${ENABLE_TLS}",
                },
                {
                  label: "traefik.http.routers.site.tls.certresolver",
                  value: "letsencrypt",
                },
              ],
          },
      },
  }

packages: {}
outputs:
  {
    siteHost: "${DOMAIN_NAME}",
    appNetworkName: "${APP_NETWORK_NAME}",
    routerEntrypoint: "${ROUTER_ENTRYPOINT}",
    enableTls: "${ENABLE_TLS}",
    protocol: "${PROTOCOL}",
  }
