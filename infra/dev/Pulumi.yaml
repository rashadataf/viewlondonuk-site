name: viewlondonuk
description: ViewLondon UK web infrastructure — dev (Traefik + Next.js, local Docker network)
runtime: yaml

config:
  pulumi:autonaming:
    value:
      pattern: "${name}-${project}-${stack}"

  HTTP_PORT: { type: string, default: "80" }
  HTTPS_PORT: { type: string, default: "443" }
  DOMAIN_NAME: { type: string, default: "localhost" }
  ADMIN_EMAIL: { type: string, secret: true }

  SITE_IMAGE_NAME: { type: string, default: "viewlondonuk/site" }
  APP_PORT: { type: string, default: "3010" }
  SITE_BUILD_CONTEXT: { type: string, default: "../../site" }
  SITE_WORKDIR_PATH: { type: string, default: "/site" }
  SITE_IMAGE_TAG: { type: string, default: "latest" }
  SITE_BUILD_PHASE_TARGET: { type: string, default: "development" }

  ENABLE_TLS: { type: boolean, default: false }
  PROTOCOL: { type: string, default: "http" }
  ROUTER_ENTRYPOINT: { type: string, default: "web" }
  CONTACT_EMAIL: { type: string, default: "" }

variables:
  appNetworkName: "${pulumi.project}-network"
  frontendContainerName: "${pulumi.project}-viewlondonuk-${pulumi.stack}"

resources:
  appNetwork:
    type: docker:Network
    properties:
      name: "${appNetworkName}"

  traefikData:
    type: docker:Volume
    properties:
      name: "traefik-data"

  nextBuildVolume:
    type: docker:Volume
    properties:
      name: "site_next_build"

  traefikImage:
    type: docker:RemoteImage
    properties:
      name: "traefik:v2.11"

  traefik:
    type: docker:Container
    properties:
      name: "${pulumi.project}-traefik-${pulumi.stack}"
      image: "${traefikImage.imageId}"
      restart: always
      ports:
        - { internal: "${HTTP_PORT}", external: "${HTTP_PORT}" }
        - { internal: "${HTTPS_PORT}", external: "${HTTPS_PORT}" }
        - { internal: 8080, external: 8080 }
      envs:
        - "TRAEFIK_PROVIDERS_DOCKER=true"
        - "TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT=false"
        - "TRAEFIK_PROVIDERS_DOCKER_NETWORK=${appNetworkName}"
        - "TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:${HTTP_PORT}"
        - "TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:${HTTPS_PORT}"
        - "TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ADMIN_EMAIL}"
        - "TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE=/data/acme.json"
        - "TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT=web"
      mounts:
        - type: bind
          source: "/var/run/docker.sock"
          target: "/var/run/docker.sock"
          readOnly: true
        - type: volume
          source: "${traefikData.name}"
          target: "/data"
      networksAdvanced:
        - name: "${appNetworkName}"
          aliases: ["traefik"]

  siteImage:
    type: docker:RemoteImage
    properties:
      name: "${SITE_IMAGE_NAME}:${SITE_IMAGE_TAG}"
      build:
        context: "${SITE_BUILD_CONTEXT}"
        buildArgs:
          SITE_WORKDIR_PATH: "${SITE_WORKDIR_PATH}"
        target: "${SITE_BUILD_PHASE_TARGET}"

  siteContainer:
    type: docker:Container
    properties:
      name: "${frontendContainerName}"
      image: "${siteImage.imageId}"
      restart: always
      envs:
        - "PORT=${APP_PORT}"
        - "DOMAIN_NAME=${DOMAIN_NAME}"
        - "PROTOCOL=${PROTOCOL}"
      mounts:
        - type: bind
          source: "${pulumi.cwd}/../../site"
          target: "${SITE_WORKDIR_PATH}"
        - type: volume
          source: "${nextBuildVolume.name}"
          target: "${SITE_WORKDIR_PATH}/.next"
      networksAdvanced:
        - name: "${appNetworkName}"
      labels:
        - { label: "traefik.enable", value: "true" }
        - { label: "traefik.http.services.site.loadbalancer.server.port", value: "${APP_PORT}" }
        - { label: "traefik.http.routers.site.entrypoints", value: "${ROUTER_ENTRYPOINT}" }
        - { label: "traefik.http.routers.site.rule", value: "Host(`${DOMAIN_NAME}`)" }
        - { label: "traefik.http.routers.site.tls", value: "${ENABLE_TLS}" }
        - { label: "traefik.http.routers.site.tls.certresolver", value: "letsencrypt" }
    options:
      dependsOn:
        - ${traefik}

packages: {}

outputs:
  siteHost: "${DOMAIN_NAME}"
  appNetworkName: "${appNetworkName}"
  routerEntrypoint: "${ROUTER_ENTRYPOINT}"
  enableTls: "${ENABLE_TLS}"
  protocol: "${PROTOCOL}"
